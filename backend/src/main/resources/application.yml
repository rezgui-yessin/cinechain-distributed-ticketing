spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cinechain}
    username: ${DATABASE_USERNAME:cinechain}
    password: ${DATABASE_PASSWORD:cinechain123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:cinechain-super-secret-key-must-be-at-least-256-bits-long-for-security}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

admin:
  email: ${ADMIN_EMAIL:admin@cinechain.com}
  password: ${ADMIN_PASSWORD:Admin@123}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:djalg6hkt}
  api-key: ${CLOUDINARY_API_KEY:675896959317332}
  api-secret: ${CLOUDINARY_API_SECRET:9fxNxXuQUOUprJDZNZx0HWyboAQ}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    com.cinechain: DEBUG
    org.springframework.security: INFO

<div class="min-h-screen flex items-center justify-center bg-[#0a0a1a] px-4 py-12 relative overflow-hidden">
  <div class="max-w-md w-full relative z-10">
    <div class="bg-[#12122a] border border-[#2a2a4a] rounded-2xl p-8 shadow-2xl backdrop-blur-xl">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-white tracking-tight">Reset Password</h2>
        <p class="text-sm text-gray-400 mt-1">Enter your email and we'll send a reset instructions link.</p>
      </div>

      <div *ngIf="submitted" class="p-4 rounded-lg bg-green-500/15 border border-green-500/30 text-green-400 text-sm mb-6 text-center">
        If an account exists for that email, password reset instructions have been sent!
      </div>

      <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="name@example.com" 
            class="input-field"
          />
        </div>

        <button 
          type="submit" 
          [disabled]="loading" 
          class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-black font-semibold rounded-lg shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
          <span>{{ loading ? 'Sending...' : 'Send Reset Link' }}</span>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-[#2a2a4a] text-center">
        <a routerLink="/login" class="text-sm text-amber-400 hover:text-amber-300 font-semibold transition-colors">
          &larr; Back to Sign In
        </a>
      </div>
    </div>
  </div>
</div>

<div class="min-h-screen flex items-center justify-center bg-[#0a0a1a] px-4 py-12 relative overflow-hidden">
  <div class="absolute -top-40 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    <div class="bg-[#12122a] border border-[#2a2a4a] rounded-2xl p-8 shadow-2xl backdrop-blur-xl">
      
      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <a routerLink="/" class="inline-flex items-center gap-2 mb-4 group">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform">
            <svg class="w-7 h-7 text-black" fill="currentColor" viewBox="0 0 24 24">
              <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-8v-2h8v2zm0-4h-8v-2h8v2zm0-4h-8V7h8v2z"/>
            </svg>
          </div>
        </a>
        <h2 class="text-2xl font-bold text-white tracking-tight">Create Account</h2>
        <p class="text-sm text-gray-400 mt-1">Join CineChain for decentralized cinema booking</p>
      </div>

      <!-- Account Badge Note -->
      <div class="mb-6 p-3 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs flex items-center gap-2.5">
        <svg class="w-4 h-4 flex-shrink-0 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span>Account type: <strong>Cinema Member</strong> (Full booking & NFT ticket access)</span>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="mb-6 p-4 rounded-lg bg-red-500/15 border border-red-500/30 text-red-400 text-sm flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <!-- Name Row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">First Name</label>
            <input 
              type="text" 
              formControlName="firstName" 
              placeholder="John" 
              class="input-field"
              [class.border-red-500]="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid"
            />
            <div *ngIf="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid" class="text-[11px] text-red-400 mt-1">
              Required
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">Last Name</label>
            <input 
              type="text" 
              formControlName="lastName" 
              placeholder="Doe" 
              class="input-field"
              [class.border-red-500]="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid"
            />
            <div *ngIf="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid" class="text-[11px] text-red-400 mt-1">
              Required
            </div>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="john.doe@example.com" 
            class="input-field"
            [class.border-red-500]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
          />
          <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="text-[11px] text-red-400 mt-1">
            Valid email is required
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">Password</label>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="At least 6 characters" 
            class="input-field"
            [class.border-red-500]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
          />
          <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="text-[11px] text-red-400 mt-1">
            Min 6 characters
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">Confirm Password</label>
          <input 
            type="password" 
            formControlName="confirmPassword" 
            placeholder="Repeat password" 
            class="input-field"
            [class.border-red-500]="registerForm.get('confirmPassword')?.touched && (registerForm.get('confirmPassword')?.invalid || registerForm.hasError('passwordMismatch'))"
          />
          <div *ngIf="registerForm.get('confirmPassword')?.touched && (registerForm.get('confirmPassword')?.hasError('passwordMismatch') || registerForm.hasError('passwordMismatch'))" class="text-[11px] text-red-400 mt-1">
            Passwords do not match
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          [disabled]="loading" 
          class="w-full mt-2 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-black font-semibold rounded-lg shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
          <svg *ngIf="loading" class="animate-spin w-5 h-5 text-black" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ loading ? 'Creating Account...' : 'Create Account' }}</span>
        </button>

      </form>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-[#2a2a4a] text-center">
        <p class="text-sm text-gray-400">
          Already have an account?
          <a routerLink="/login" class="text-amber-400 hover:text-amber-300 font-semibold ml-1 transition-colors">
            Sign In
          </a>
        </p>
      </div>

    </div>
  </div>
</div>

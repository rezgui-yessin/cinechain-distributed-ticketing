<app-navbar></app-navbar>

<div class="min-h-screen bg-[#0a0a1a] text-white py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    
    <div class="mb-10 text-center max-w-2xl mx-auto">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Our Luxury Theaters</h1>
      <p class="text-gray-400 mt-2 text-sm sm:text-base">Experience state-of-the-art projection, Dolby Atmos sound, and VIP recliner seating at CineChain locations.</p>
    </div>

    <div *ngIf="loading" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let i of [1,2,3]" class="card animate-pulse h-80 bg-[#12122a]"></div>
    </div>

    <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let cinema of cinemas" class="card p-0 overflow-hidden bg-[#12122a] border border-[#2a2a4a] hover:border-amber-500/50 transition-all flex flex-col justify-between">
        
        <div class="relative h-48 bg-[#1a1a3a] overflow-hidden">
          <img [src]="cinema.imageUrl" [alt]="cinema.name" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" />
          <div class="absolute bottom-3 left-3 px-2.5 py-1 rounded-md bg-black/70 backdrop-blur-md border border-white/10 text-xs font-semibold text-white">
            {{ cinema.city }}
          </div>
        </div>

        <div class="p-6 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="text-xl font-bold text-white mb-2">{{ cinema.name }}</h3>
            <p class="text-xs text-gray-400 flex items-center gap-2 mb-2">
              <svg class="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              <span>{{ cinema.address }}</span>
            </p>
            <p class="text-xs text-gray-400 flex items-center gap-2 mb-4">
              <svg class="w-4 h-4 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span>{{ cinema.phone }}</span>
            </p>
          </div>

          <div class="pt-4 border-t border-[#1f1f3a] flex items-center justify-between">
            <span class="text-xs text-amber-400 font-medium">{{ cinema.hallCount || 4 }} Premium Screens</span>
            <a routerLink="/movies" class="btn-primary text-xs px-4 py-2">View Showtimes</a>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<div class="min-h-screen bg-[#070714] text-gray-100 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto flex flex-col h-[85vh] bg-[#0d0d24] border border-[#23234b] rounded-2xl shadow-2xl overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-4 bg-gradient-to-r from-[#121233] to-[#1a1440] border-b border-[#23234b] flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-400 to-indigo-500 flex items-center justify-center shadow-lg shadow-teal-500/20">
          <span class="text-xl">🤖</span>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white flex items-center gap-2">
            AI Movie Concierge
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-300 border border-teal-500/40 font-mono font-semibold">Gemini 1.5</span>
          </h1>
          <p class="text-xs text-gray-400">Natural language movie, seat, and screening recommendations</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs text-gray-400 font-mono">Live</span>
      </div>
    </div>

    <!-- Quick Prompts Banner -->
    <div class="px-6 py-2.5 bg-[#0a0a1f] border-b border-[#1c1c3d] flex gap-2 overflow-x-auto text-xs scrollbar-thin">
      <button *ngFor="let p of quickPrompts"
              (click)="useQuickPrompt(p)"
              class="whitespace-nowrap px-3 py-1.5 rounded-full bg-[#181838] hover:bg-teal-500/20 hover:text-teal-300 hover:border-teal-500/40 border border-[#282852] text-gray-300 transition-all">
        {{ p }}
      </button>
    </div>

    <!-- Chat Messages Scroll Area -->
    <div #scrollContainer class="flex-1 overflow-y-auto p-6 space-y-4">
      <div *ngFor="let msg of messages"
           class="flex"
           [ngClass]="msg.role === 'user' ? 'justify-end' : 'justify-start'">

        <!-- Avatar for Assistant -->
        <div *ngIf="msg.role === 'assistant'" class="w-8 h-8 rounded-lg bg-teal-500/20 text-teal-300 border border-teal-500/30 flex items-center justify-center text-sm mr-3 flex-shrink-0 self-start">
          🤖
        </div>

        <div class="max-w-[78%] flex flex-col" [ngClass]="msg.role === 'user' ? 'items-end' : 'items-start'">
          <div class="rounded-2xl px-4 py-3 text-sm leading-relaxed whitespace-pre-line shadow-md"
               [ngClass]="msg.role === 'user' 
                  ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-black font-medium rounded-tr-none' 
                  : 'bg-[#151535] text-gray-200 border border-[#272750] rounded-tl-none'">
            {{ msg.text }}
          </div>

          <!-- Recommended Movie Cards (if present) -->
          <div *ngIf="msg.recommendedMovies && msg.recommendedMovies.length > 0" class="mt-3 w-full grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <a *ngFor="let movie of msg.recommendedMovies"
               [routerLink]="['/movies', movie.id]"
               class="flex items-center gap-3 p-2.5 rounded-xl bg-[#0e0e29] border border-[#2a2a58] hover:border-teal-400/60 hover:bg-[#14143a] transition-all group">
              <img *ngIf="movie.posterUrl" [src]="movie.posterUrl" [alt]="movie.title" class="w-12 h-16 object-cover rounded-md flex-shrink-0 shadow">
              <div *ngIf="!movie.posterUrl" class="w-12 h-16 bg-[#1a1a38] rounded-md flex items-center justify-center text-gray-500 text-xs flex-shrink-0">
                🎬
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-xs font-bold text-white group-hover:text-teal-300 truncate">{{ movie.title }}</p>
                <p class="text-[11px] text-gray-400 truncate">{{ movie.genre }}</p>
                <div class="flex items-center gap-1.5 mt-1">
                  <span class="text-amber-400 text-xs">★</span>
                  <span class="text-[11px] text-gray-300 font-mono">{{ movie.rating || 'N/A' }}</span>
                  <span class="text-[10px] text-teal-400 font-medium ml-auto group-hover:underline">View Screenings →</span>
                </div>
              </div>
            </a>
          </div>

          <span class="text-[10px] text-gray-500 mt-1 px-1 font-mono">{{ msg.time }}</span>
        </div>

        <!-- Avatar for User -->
        <div *ngIf="msg.role === 'user'" class="w-8 h-8 rounded-lg bg-amber-500 text-black font-bold flex items-center justify-center text-xs ml-3 flex-shrink-0 self-start">
          Me
        </div>
      </div>

      <!-- Loading Indicator -->
      <div *ngIf="isLoading" class="flex justify-start items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-teal-500/20 text-teal-300 border border-teal-500/30 flex items-center justify-center text-sm flex-shrink-0">
          🤖
        </div>
        <div class="bg-[#151535] border border-[#272750] rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-teal-400 animate-bounce"></span>
          <span class="w-2 h-2 rounded-full bg-teal-400 animate-bounce [animation-delay:0.2s]"></span>
          <span class="w-2 h-2 rounded-full bg-teal-400 animate-bounce [animation-delay:0.4s]"></span>
          <span class="text-xs text-gray-400 ml-1 font-mono">Gemini is searching schedule & seats...</span>
        </div>
      </div>
    </div>

    <!-- Input Form -->
    <div class="p-4 bg-[#0a0a1f] border-t border-[#1c1c3d]">
      <form (ngSubmit)="sendMessage()" class="flex items-center gap-3">
        <input
          type="text"
          [(ngModel)]="inputMessage"
          name="chatInput"
          [disabled]="isLoading"
          placeholder="Ask: 'Any thriller on Saturday after 7 PM?' or 'Where should I sit for Dune?'..."
          class="flex-1 bg-[#141432] border border-[#272750] focus:border-teal-400 focus:outline-none rounded-xl px-4 py-3 text-sm text-gray-100 placeholder-gray-500"
          autocomplete="off"
        />
        <button
          type="submit"
          [disabled]="!inputMessage.trim() || isLoading"
          class="px-5 py-3 rounded-xl bg-gradient-to-r from-teal-500 to-indigo-600 hover:from-teal-400 hover:to-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-teal-500/20 transition-all flex-shrink-0"
        >
          <span>Send</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>
    </div>

  </div>
</div>

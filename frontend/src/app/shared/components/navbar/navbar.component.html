<header class="bg-[#0a0a1a]/95 backdrop-blur-md border-b border-[#2a2a4a] sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo -->
      <a routerLink="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform duration-200">
          <svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-8v-2h8v2zm0-4h-8v-2h8v2zm0-4h-8V7h8v2z"/>
          </svg>
        </div>
        <div>
          <span class="text-xl font-bold tracking-wider text-white">CINE<span class="text-amber-500">CHAIN</span></span>
          <span class="block text-[10px] tracking-widest text-gray-400 uppercase font-medium">Decentralized Cinema</span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-8">
        <a routerLink="/" routerLinkActive="text-amber-400 font-semibold" [routerLinkActiveOptions]="{exact: true}"
           class="text-gray-300 hover:text-white transition-colors text-sm font-medium">Home</a>
        <a routerLink="/movies" routerLinkActive="text-amber-400 font-semibold"
           class="text-gray-300 hover:text-white transition-colors text-sm font-medium">Movies</a>
        <a routerLink="/cinemas" routerLinkActive="text-amber-400 font-semibold"
           class="text-gray-300 hover:text-white transition-colors text-sm font-medium">Cinemas</a>
        <a routerLink="/resale" routerLinkActive="text-emerald-400 font-semibold"
           class="text-gray-300 hover:text-white transition-colors text-sm font-medium flex items-center gap-1.5">
          <span>🎟️ Resale P2P</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">Fair</span>
        </a>
        <a routerLink="/concessions" routerLinkActive="text-amber-400 font-semibold"
           class="text-gray-300 hover:text-white transition-colors text-sm font-medium flex items-center gap-1.5">
          <span>🍿 Snacks & Drinks</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-400 font-bold border border-amber-500/30">VIP</span>
        </a>
      </nav>

      <!-- User Auth Section -->
      <div class="hidden md:flex items-center gap-4">
        <ng-container *ngIf="!currentUser; else loggedInTpl">
          <a routerLink="/login" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-white transition-colors">
            Sign In
          </a>
          <a routerLink="/register" class="btn-primary text-sm px-5 py-2">
            Get Started
          </a>
        </ng-container>

        <ng-template #loggedInTpl>
          <div class="flex items-center gap-3">
            <button (click)="navigateToDashboard()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#1a1a3a] border border-[#2a2a4a] hover:border-amber-500/50 transition-all">
              <div class="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs">
                {{ currentUser?.firstName?.charAt(0) || 'U' }}
              </div>
              <span class="text-sm font-medium text-gray-200">{{ currentUser?.firstName }}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">
                {{ currentUser?.role }}
              </span>
            </button>
            <button (click)="logout()" title="Logout" class="p-2 rounded-lg text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
            </button>
          </div>
        </ng-template>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMobileMenu()" class="p-2 rounded-md text-gray-400 hover:text-white focus:outline-none">
          <svg *ngIf="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg *ngIf="mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div *ngIf="mobileMenuOpen" class="md:hidden bg-[#0d0d20] border-b border-[#2a2a4a] px-4 pt-2 pb-4 space-y-2">
    <a routerLink="/" (click)="mobileMenuOpen = false" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-[#1a1a3a] hover:text-white">Home</a>
    <a routerLink="/movies" (click)="mobileMenuOpen = false" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-[#1a1a3a] hover:text-white">Movies</a>
    <a routerLink="/cinemas" (click)="mobileMenuOpen = false" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-[#1a1a3a] hover:text-white">Cinemas</a>
    <a routerLink="/concessions" (click)="mobileMenuOpen = false" class="block px-3 py-2 rounded-md text-base font-medium text-amber-400 hover:bg-[#1a1a3a]">🍿 In-Seat Snacks (VIP)</a>
    
    <div class="pt-4 border-t border-[#2a2a4a]">
      <ng-container *ngIf="!currentUser; else mobileLoggedIn">
        <a routerLink="/login" (click)="mobileMenuOpen = false" class="block w-full text-center py-2 text-sm font-medium text-gray-300 mb-2">Sign In</a>
        <a routerLink="/register" (click)="mobileMenuOpen = false" class="block w-full text-center py-2 btn-primary text-sm">Get Started</a>
      </ng-container>
      <ng-template #mobileLoggedIn>
        <button (click)="navigateToDashboard(); mobileMenuOpen = false" class="w-full text-left px-3 py-2 rounded-md text-sm font-medium text-amber-400 bg-amber-500/10 mb-2">
          Dashboard ({{ currentUser?.firstName }})
        </button>
        <button (click)="logout(); mobileMenuOpen = false" class="w-full text-left px-3 py-2 rounded-md text-sm font-medium text-red-400 hover:bg-red-500/10">
          Sign Out
        </button>
      </ng-template>
    </div>
  </div>
</header>

name: CineChain CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ==========================================
  # JOB 1: Backend (Spring Boot + Java 21)
  # ==========================================
  backend-build-test:
    name: ☕ Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cinechain
          POSTGRES_USER: cinechain
          POSTGRES_PASSWORD: cinechain123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: 🏗️ Build Backend with Maven
        run: |
          cd backend
          mvn clean package -DskipTests -B

      - name: 🧪 Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn test -B
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/cinechain
          DATABASE_USERNAME: cinechain
          DATABASE_PASSWORD: cinechain123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: cinechain-ci-cd-test-jwt-secret-at-least-256-bits-long
          ADMIN_EMAIL: admin@cinechain.com
          ADMIN_PASSWORD: Admin@CineChain2024!
          CLOUDINARY_CLOUD_NAME: djalg6hkt
          CLOUDINARY_API_KEY: 675896959317332
          CLOUDINARY_API_SECRET: 9fxNxXuQUOUprJDZNZx0HWyboAQ

  # ==========================================
  # JOB 2: Frontend (Angular 18 + Node 22)
  # ==========================================
  frontend-build-lint:
    name: 🅰️ Frontend Build & Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: 🚀 Build Angular Production Bundle
        run: |
          cd frontend
          npm run build:prod

  # ==========================================
  # JOB 3: Docker Compose Full Stack Verification
  # ==========================================
  docker-validation:
    name: 🐳 Docker Multi-Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-lint]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21 for Pre-packaged JAR
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: 📦 Pre-package Backend JAR for Docker
        run: |
          cd backend
          mvn clean package -DskipTests -B

      - name: 🐳 Build Docker Images
        run: |
          docker compose build
        env:
          CLOUDINARY_CLOUD_NAME: djalg6hkt
          CLOUDINARY_API_KEY: 675896959317332
          CLOUDINARY_API_SECRET: 9fxNxXuQUOUprJDZNZx0HWyboAQ
